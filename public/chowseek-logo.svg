<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="170"
  height="170"
  viewBox="-2.5 -7.5 186 186"
  role="img"
  aria-label="Magnifying glass around a steaming bowl"
  shape-rendering="geometricPrecision"
  xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient
      id="green"
      x1="29"
      y1="20"
      x2="175"
      y2="169"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#53661E"/>
      <stop offset="0.52" stop-color="#405615"/>
      <stop offset="1" stop-color="#344A0F"/>
    </linearGradient>

    <linearGradient
      id="orange"
      x1="87"
      y1="40"
      x2="94"
      y2="140"
      gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DC752D"/>
      <stop offset="1" stop-color="#CE6224"/>
    </linearGradient>
  </defs>

  <!--
  <rect
    x="-2.5"
    y="-7.5"
    width="186"
    height="186"
    fill="#FDF7E9"/>
    -->

  <!-- Handle attached at the outer rim, not intruding into the lens -->
  <path
    d="M 144.77 139.77 L 175.1 170.1"
    fill="none"
    stroke="url(#green)"
    stroke-width="17"
    stroke-linecap="round" />

  <circle
    cx="90.5"
    cy="85.5"
    r="70"
    fill="none"
    stroke="url(#green)"
    stroke-width="13.5"/>

  <path
    d="M 39.1 93.6
       H 141.9
       A 51.4 45.6 0 0 1 39.1 93.6
       Z"
    fill="url(#orange)"/>

  <!-- Steam: evenly spaced, cleaner, more intentional -->
  <g
    fill="none"
    stroke="url(#orange)"
    stroke-width="5.2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <!-- left -->
    <path
      d="M 72 56
         C 68 60, 68 65, 72 69
         C 76 73, 76 78, 72 82" />

    <!-- center -->
    <path
      d="M 90.5 42
         C 85.5 47, 85.5 55, 90.5 62
         C 95.5 69, 95.5 77, 90.5 82" />

    <!-- right -->
    <path
      d="M 109 56
         C 105 60, 105 65, 109 69
         C 113 73, 113 78, 109 82" />
  </g>
</svg>
