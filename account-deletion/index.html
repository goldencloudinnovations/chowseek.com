<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="robots"
    content="noindex,nofollow,noarchive"
  />

  <meta
    name="referrer"
    content="no-referrer"
  />

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self';
      style-src 'self';
      img-src 'self' data:;
      connect-src https://ugbindlzyqaktejbxalk.supabase.co;
      base-uri 'none';
      form-action 'none'
    "
  />

  <meta
    name="theme-color"
    content="#fdf7e9"
  />

  <link
    rel="icon"
    href="/favicon.svg"
    type="image/svg+xml"
  />

  <link
    rel="stylesheet"
    href="/assets/styles.css"
  />

  <title>
    Account deletion — Chowseek
  </title>
</head>

<body>
  <main class="account-action-page">
    <section
      class="account-action-card"
      aria-live="polite"
    >
      <a
        class="brand"
        href="/"
        aria-label="Chowseek home"
      >
        <span class="brand-mark" aria-hidden="true"><img src="/chowseek-logo.svg" alt="" /></span>

        Chowseek
      </a>

      <div
        class="account-action-icon"
        data-action-icon
        aria-hidden="true"
      >
        !
      </div>

      <h1 data-action-title>
        Checking your link…
      </h1>

      <p
        class="account-action-copy"
        data-action-copy
      >
        Chowseek is preparing this account request.
      </p>

      <div
        class="account-action-warning"
        data-action-warning
        hidden
      ></div>

      <button
        class="button button-primary account-action-button"
        type="button"
        data-action-submit
        hidden
      >
        Continue
      </button>

      <a
        class="button button-secondary account-action-app"
        href="/"
        data-action-app
        hidden
      >
        Return to Chowseek
      </a>

      <p class="account-action-help">
        Need help?
        <a href="mailto:support@chowseek.com">
          support@chowseek.com
        </a>
      </p>
    </section>
  </main>

  <footer class="account-action-footer">
    <nav class="footer-links" aria-label="Legal and support">
      <a href="/privacy/">Privacy Policy</a>
      <a href="/cookie/">Cookie Policy</a>
      <a href="/terms/">Terms &amp; Conditions</a>
      <button type="button" class="footer-link-button" data-cookie-settings>Cookie Settings</button>
      <button type="button" class="footer-link-button" data-do-not-sell-share>Do Not Sell or Share My Personal Information</button>
    </nav>
    <small>© <span data-year></span> Chowseek.</small>
  </footer>

  <script
    type="module"
    src="/assets/account-deletion.js"
  ></script>
  <script type="module" src="/assets/legal.js"></script>
  <script type="module" src="/assets/cookies.js"></script>
</body>
</html>
